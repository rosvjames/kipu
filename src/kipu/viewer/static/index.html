<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kipu</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <div class="brand"><svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 4h14M6 4v9M10 4v12M14 4v7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linecap="round"/><circle cx="6" cy="9" r="1.7"/><circle cx="10" cy="12" r="1.7"/><circle cx="14" cy="8" r="1.7"/></svg>
    <b>kipu</b><span id="project"></span></div>
  <div class="seg" role="group" aria-label="Vista">
    <button data-mode="data">Datos</button><button data-mode="code">Código</button>
  </div>
  <input id="search" type="search" placeholder="Buscar…" autocomplete="off">
  <button id="btn-tour" class="primary" title="Sigue el dato paso a paso desde el origen">▶ Recorrido</button>
  <button id="btn-changes" class="chip" title="Lo que cambió desde la línea base y lo que depende de ello">Cambios <b id="n-changes">0</b></button>
  <button id="btn-ctl" class="chip" title="Mostrar quién ejecuta o dispara qué">Orquestación</button>
  <span class="grow"></span>
  <button id="btn-open" class="ghost" title="Abrir o cerrar todos los bloques">Abrir todo</button>
  <button id="btn-theme" class="ghost" title="Tema claro / oscuro">◐</button>
  <span id="live" class="live">● en vivo</span>
</header>
<main>
  <svg id="map" role="img" aria-label="Mapa del proyecto">
    <defs>
      <marker id="m-arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" class="mk"/></marker>
      <marker id="m-acc" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" class="mk acc"/></marker>
      <marker id="m-bad" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" class="mk bad"/></marker>
      <marker id="m-ctl" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0.8 L9,5 L0,9.2 z" class="mk ctl"/></marker>
      <marker id="m-ret" viewBox="0 0 10 10" refX="8.5" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M1,1.5 L8.5,5 L1,8.5 z" class="mk ret"/></marker>
    </defs>
    <g id="world">
      <g id="l-groups"></g><g id="l-ctl"></g><g id="l-edges"></g><g id="l-nodes"></g><g id="l-pills"></g>
      <g id="l-tour"><circle id="dot" r="6.5" visibility="hidden"/></g>
    </g>
  </svg>
  <button id="more-l" class="more" hidden></button><button id="more-r" class="more" hidden></button>
  <div id="empty" hidden></div>
  <div id="tray" hidden></div>
  <div class="zoom"><button id="z-in" title="Acercar">+</button><button id="z-out" title="Alejar">−</button><button id="z-fit" title="Ver todo">⤢</button></div>
  <aside id="panel" hidden><button id="panel-close" class="ghost" title="Cerrar">✕</button><div id="panel-body"></div></aside>
  <div id="tour" hidden></div>
</main>
<footer>
  <span class="lg"><i class="ln"></i> exacta</span>
  <span class="lg"><i class="ln inferred"></i> inferida</span>
  <span class="lg"><i class="ln unresolved"></i> sin resolver</span>
  <span class="lg"><b class="num">3</b> conexiones</span>
  <span class="lg"><i class="sw c-proc"></i> procesos</span>
  <span class="lg"><i class="sw c-bronze"></i><i class="sw c-silver"></i><i class="sw c-gold"></i> capas de datos</span>
  <span id="status"></span>
</footer>
<script src="/app.js"></script>
</body>
</html>
